<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Embed host test</title>
<style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.6}
iframe{width:100%;border:0;display:block}</style></head>
<body>
<h1>Host page (embed test)</h1>
<p>Body copy above the figure, in the host page's own typography.</p>
<iframe id="fig" src="ai-chip-owners.html" height="420" title="US AI chip owners" loading="lazy" scrolling="no"></iframe>
<p>Body copy below. The iframe auto-resizes via postMessage.</p>
<script>
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "hg-figure-height") {
    document.getElementById("fig").height = e.data.height;
  }
});
</script>
</body></html>
